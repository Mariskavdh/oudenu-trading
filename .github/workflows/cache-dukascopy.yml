name: Cache Dukascopy M1 historical candles
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'
permissions:
  contents: write
concurrency:
  group: dukascopy-cache
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch missing historical candles
        run: node scripts/fetch-history.mjs
      - name: Commit cache to GitHub Pages
        run: |
          git config user.name "oudenu-market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data/
          if ! git diff --cached --quiet; then
            git commit -m "Cache historical Dukascopy M1 candles"
            git push
          fi
